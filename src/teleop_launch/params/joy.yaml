teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.4
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.4
    scale_angular_turbo:
      yaw: 1.0

    enable_button: 0  # X button
    enable_turbo_button: 1  # A button

joy_node:
  ros__parameters:
    deadzone: 0.1
    autorepeat_rate: 20.0
